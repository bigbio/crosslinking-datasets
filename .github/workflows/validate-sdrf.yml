name: Validate SDRF Files

on:
  pull_request:
    paths:
      - '**.sdrf.tsv'

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install sdrf-pipelines
        run: |
          pip install sdrf-pipelines
      
      - name: Get changed SDRF files
        id: changed-files
        run: |
          # Get list of changed .sdrf.tsv files
          git fetch origin ${{ github.base_ref }}
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '\.sdrf\.tsv$' || true)
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "No SDRF files changed"
            echo "files=" >> $GITHUB_OUTPUT
          else
            echo "Changed SDRF files:"
            echo "$CHANGED_FILES"
            # Convert to JSON array for matrix
            FILES_JSON=$(echo "$CHANGED_FILES" | jq -R -s -c 'split("\n")[:-1]')
            echo "files=$FILES_JSON" >> $GITHUB_OUTPUT
          fi
      
      - name: Validate SDRF files
        if: steps.changed-files.outputs.files != ''
        run: |
          FILES='${{ steps.changed-files.outputs.files }}'
          VALIDATION_FAILED=0

          while IFS= read -r file; do
            if [ -f "$file" ]; then
              echo "::group::Validating $file"

              # Auto-detect organism from SDRF to select species template
              ORGANISM=$(python3 -c "
          with open('$file') as f:
              header = f.readline().strip().split('\t')
              values = f.readline().strip().split('\t')
              for i, h in enumerate(header):
                  if h == 'characteristics[organism]':
                      print(values[i].lower())
                      break
          ")

              # Map organism to template
              SPECIES_FLAG=""
              case "$ORGANISM" in
                "homo sapiens") SPECIES_FLAG="-t human" ;;
                "mus musculus"|"rattus norvegicus"|"sus scrofa"|"bos taurus"|"gallus gallus"|"danio rerio"|"xenopus laevis")
                  SPECIES_FLAG="-t vertebrates" ;;
                "drosophila melanogaster"|"caenorhabditis elegans"|"saccharomyces cerevisiae"|"schizosaccharomyces pombe")
                  SPECIES_FLAG="-t invertebrates" ;;
                "arabidopsis thaliana"|"oryza sativa"|"zea mays"|"chlamydomonas reinhardtii")
                  SPECIES_FLAG="-t plants" ;;
              esac

              echo "Detected organism: $ORGANISM -> species template: $SPECIES_FLAG"

              if parse_sdrf validate-sdrf --sdrf_file "$file" -t ms-proteomics -t crosslinking $SPECIES_FLAG; then
                echo "::notice file=$file::SDRF passed validation"
              else
                echo "::error file=$file::SDRF validation failed"
                VALIDATION_FAILED=1
              fi

              echo "::endgroup::"
            fi
          done < <(echo "$FILES" | jq -r '.[]')

          if [ $VALIDATION_FAILED -eq 1 ]; then
            echo "::error::One or more SDRF files failed validation"
            exit 1
          fi

          echo "All SDRF files passed validation"
